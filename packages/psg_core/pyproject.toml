[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psg_core"
version = "0.1.0"
description = "Shared PSG parsing, metrics, and clinical decision-support for the Human Sleep Project dashboard"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["psg_core*"]
